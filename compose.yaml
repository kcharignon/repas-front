name: repas-front

# Le front se branche sur le back de développement (dépôt `repas`, `docker compose up`) en rejoignant son réseau Docker :
# le service `php` du back répond en HTTP sur `http://php` (ADR 0004). Autre back : REPAS_API_URL et REPAS_BACK_NETWORK.
services:
  front:
    build:
      context: .
      target: dev
    init: true
    ports:
      - "${FRONT_PORT:-5173}:5173"
    environment:
      REPAS_API_URL: ${REPAS_API_URL:-http://php}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks: [default, back]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Tests de bout en bout (Chromium dans le conteneur) contre le serveur de développement ET le vrai back.
  # `make e2e` ; les rapports, captures, vidéos et traces tombent dans playwright-report/ et test-results/.
  e2e:
    profiles: [e2e]
    build:
      context: .
      target: dev
    init: true
    depends_on:
      front:
        condition: service_healthy
    # Même pile réseau que le front : l'application est sur `localhost`, contexte sûr pour le navigateur (cookies `Secure`).
    network_mode: service:front
    environment:
      E2E_BASE_URL: http://localhost:5173
      E2E_WITH_BACK: "1"
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      E2E_VISUAL: ${E2E_VISUAL:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npx", "playwright", "test"]

  # Lecture hors-ligne (service worker) contre l'image de production : `make e2e-offline`. Même pile réseau que `prod` : l'application
  # est sur `localhost`, seul contexte sûr (hors HTTPS) où un navigateur accepte un service worker.
  e2e-offline:
    profiles: [offline]
    build:
      context: .
      target: dev
    init: true
    depends_on:
      prod:
        condition: service_healthy
    network_mode: service:prod
    environment:
      E2E_BASE_URL: http://localhost
      E2E_PROD_URL: http://localhost
      E2E_WITH_BACK: "1"
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      E2E_VISUAL: ${E2E_VISUAL:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npx", "playwright", "test"]

  # Budgets Lighthouse sur l'image de production : `make lighthouse` (compte de démonstration, `make fixtures`).
  lighthouse:
    profiles: [lighthouse]
    build:
      context: .
      target: dev
    init: true
    depends_on:
      prod:
        condition: service_healthy
    network_mode: service:prod
    environment:
      LH_URL: http://localhost
      LH_EMAIL: ${LH_EMAIL:-user@repas.fr}
      LH_PASSWORD: ${LH_PASSWORD:-M0t 2 p@sse}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm install --prefix /tmp/lighthouse --no-save --no-audit --no-fund lighthouse@13.5.0 > /dev/null && LIGHTHOUSE_MODULE=/tmp/lighthouse/node_modules/lighthouse/core/index.js node scripts/lighthouse.mjs

  # Rapport HTML de Playwright : http://localhost:9323 (captures, vidéos, traces).
  e2e-report:
    profiles: [report]
    build:
      context: .
      target: dev
    init: true
    ports:
      - "9323:9323"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npx", "playwright", "show-report", "--host", "0.0.0.0", "--port", "9323"]

  # Application Android « Repas Drive » (DRV-311, android/) : `make android`, `make android-test`, `make android-release`.
  # Image JDK 17 + Gradle + SDK Android (sans Node). Les sources sont montées, les APK tombent dans android/dist/. Le cache de
  # Gradle vit dans un volume ; le conteneur tourne avec l'identifiant de l'utilisateur (voir le Makefile). Les variables sans valeur
  # (clé de signature, étiquette, compteur) sont reprises de l'environnement de l'appelant, jamais écrites ici.
  android:
    profiles: [android]
    build:
      context: ./android
    init: true
    working_dir: /work/android
    environment:
      - ANDROID_VERSION_TAG
      - ANDROID_VERSION_CODE
      - ANDROID_COMMIT=${ANDROID_COMMIT:-local}
      - ANDROID_KEYSTORE_BASE64
      - ANDROID_KEYSTORE_PASSWORD
      - ANDROID_KEY_ALIAS
      - ANDROID_KEY_PASSWORD
    volumes:
      - ./android:/work/android
      - android-gradle:/gradle

  # Application Android jetable du chantier drive (DRV-011, drive-agent/android-lab) : `make android-lab`.
  # Image JDK 17 + Gradle + SDK Android (sans Node). Les sources sont montées, l'APK tombe dans drive-agent/android-lab/dist/.
  # Le cache de Gradle vit dans un volume ; le conteneur tourne avec l'identifiant de l'utilisateur (voir le Makefile).
  android-lab:
    profiles: [android]
    build:
      context: ./drive-agent/android-lab
    init: true
    working_dir: /work/drive-agent/android-lab
    environment:
      ANDROID_LAB_VERSION_CODE: ${ANDROID_LAB_VERSION_CODE:-1}
      ANDROID_LAB_COMMIT: ${ANDROID_LAB_COMMIT:-local}
    volumes:
      - ./drive-agent:/work/drive-agent
      - android-lab-gradle:/gradle

  # Image de production (statique + relais vers le back) : http://localhost:8081, pour essayer le build comme en production.
  prod:
    profiles: [prod]
    build:
      context: .
      target: prod
    init: true
    ports:
      - "${PROD_PORT:-8081}:80"
    environment:
      REPAS_API_URL: ${REPAS_API_URL:-http://php}
    networks: [default, back]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  node_modules:
  android-lab-gradle:
  android-gradle:

networks:
  back:
    name: ${REPAS_BACK_NETWORK:-repas_default}
    external: true
