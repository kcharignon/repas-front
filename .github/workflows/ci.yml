name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (oxlint, ESLint)
        run: npm run lint
      - name: Format (Prettier)
        run: npm run format:check
      - name: Types de l'API (générés depuis le contrat figé)
        run: npm run api:check
      - name: Contrat figé (identique au commit du back)
        run: npm run api:verify
      - name: Types (vue-tsc)
        run: npm run type-check
      - name: Tests unitaires et couverture
        run: npm run test:coverage
      - name: Build
        run: npm run build-only

  e2e:
    name: Bout en bout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-only
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Avis de sécurité (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Les dépendances qui partent en production : un avis haut ou critique fait échouer la CI.
      # Les outils de développement (lint, tests) sont listés par `npm audit` mais ne bloquent pas.
      - run: npm audit --omit=dev --audit-level=high
