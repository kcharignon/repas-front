name: Android release

# Publication SIGNÉE de l'application Repas (DRV-315), la seule que les proches installent. Elle est déclenchée UNIQUEMENT par une étiquette
# `android-vX.Y.Z` poussée par l'humain (`git push origin android-v0.1.0`) : jamais par une PR, jamais par `main`, jamais à la main, et il n'y a
# aucune variante qui publierait sans clé. Procédure pas à pas : android/PUBLICATION.md. Les pré-versions de débogage (android.yml,
# `android-dev-<date>`) et les bancs d'essai (android-lab.yml) sont d'une autre famille, signée d'une clé publique.
#
# Deux travaux, pour que le secret et le droit d'écrire ne se croisent jamais :
#   - « build » (lecture seule) tient les quatre secrets de signature dans l'environnement des deux seules étapes qui en ont besoin, construit l'APK
#     avec `make android-release` (agent embarqué vérifié par android/agent.js.sha384, BuildConfig.DEBUG faux, code de version tiré de l'étiquette)
#     puis le contrôle (`make android-release-verify` : certificat de signature attendu, une seule permission, rien de débogage) ;
#   - « publish » (écriture) n'a aucun secret : il publie l'APK contrôlé, son empreinte et `version.json`, puis relit ce qui est publié.
# L'empreinte du certificat attendu est celle que le site publie dans public/.well-known/assetlinks.json (publique, relue en PR) : une
# mauvaise clé dans les secrets arrête tout avant la publication. Aucune valeur secrète n'est affichée : aucune commande n'écrit un secret.
on:
  push:
    tags:
      - 'android-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  # Une publication commencée n'est jamais interrompue.
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    name: APK signé et contrôlé (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Secrets de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Seuls les NOMS manquants sont écrits, jamais une valeur.
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Pas de clé de signature::Secret(s) GitHub manquant(s) : ${missing[*]}. Une publication se signe avec la clé de l'utilisateur, jamais sans. Procédure pas à pas : https://github.com/${GITHUB_REPOSITORY}/blob/main/android/PUBLICATION.md (étapes 1 à 3). Rien n'a été construit ni publié."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Étiquette, commit et numéro de version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error title=Étiquette refusée::$*"; exit 1; }
          [[ "$TAG" =~ ^android-v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]] \
            || fail "« $TAG » n'est pas une version android-vX.Y.Z (par exemple android-v0.1.0)."
          # On ne publie que ce qui a été relu et fusionné : le commit de l'étiquette est dans main.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || fail "le commit de l'étiquette $TAG n'est pas dans main : on ne publie que ce qui a été relu et fusionné."
          # Le code de version vient de l'étiquette et ne doit jamais baisser : une version plus ancienne que la dernière publiée ne se mettrait pas par-dessus.
          latest=$(git tag --list 'android-v*' | grep -E '^android-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sed 's/^android-v//' | sort -V | tail -n 1)
          [ "$latest" = "${TAG#android-v}" ] || fail "une étiquette plus récente existe déjà : android-v$latest. Une version plus ancienne ne s'installerait pas par-dessus."
          if gh release view "$TAG" > /dev/null 2>&1; then
            fail "une release $TAG existe déjà. Pour republier, choisir un numéro plus grand (android/PUBLICATION.md)."
          fi

      - name: Empreinte du certificat attendu
        run: |
          # L'empreinte (publique) que le site déclare pour l'application : public/.well-known/assetlinks.json, relu en PR avant la première publication.
          file=public/.well-known/assetlinks.json
          if [ ! -f "$file" ]; then
            echo "::error title=assetlinks.json manque::public/.well-known/assetlinks.json n'existe pas encore : l'empreinte du certificat attendu y est écrite. À publier avant la première version (android/PUBLICATION.md, étape 4). Rien n'a été construit ni publié."
            exit 1
          fi
          expected=$(jq -r '[.[] | select(.target.package_name == "eu.kantin.repas.drive") | .target.sha256_cert_fingerprints[]] | join(",")' "$file")
          if [ -z "$expected" ]; then
            echo "::error title=assetlinks.json vide::Aucune empreinte pour eu.kantin.repas.drive dans $file."
            exit 1
          fi
          echo "ANDROID_EXPECTED_CERT_SHA256=$expected" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Agent du drive (actif de l'application)
        run: |
          npm run agent:build
          # Une seconde porte, avant même Gradle : l'agent construit doit avoir l'empreinte notée dans android/agent.js.sha384.
          actual="sha384-$(openssl dgst -sha384 -binary drive-agent/dist/agent.js | base64 -w0)"
          expected=$(tr -d ' \t\r\n' < android/agent.js.sha384)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Agent altéré::L'agent construit n'a pas l'empreinte de android/agent.js.sha384 (attendue $expected, construite $actual). Rien n'est publié : make android-agent-hash, relire, fusionner, puis une nouvelle étiquette."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./android
          load: true
          tags: repas-front-android:latest
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max

      - name: Tests Kotlin
        run: make android-test ANDROID_AGENT=

      - name: APK signé
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le nom ET le code de version viennent de l'étiquette (android/README.md, « Version »).
          ANDROID_VERSION_TAG: ${{ github.ref_name }}
          ANDROID_COMMIT: ${{ github.sha }}
        run: make android-release ANDROID_AGENT=

      - name: Contrôle de l'APK (certificat attendu, permissions, version, agent)
        env:
          ANDROID_VERSION_TAG: ${{ github.ref_name }}
        run: make android-release-verify

      - name: Fichiers et notes de la release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          facts=android/dist/release-facts.env
          fact() { grep "^$1=" "$facts" | cut -d= -f2-; }
          name=$(fact VERSION_NAME); code=$(fact VERSION_CODE); sha256=$(fact APK_SHA256); cert=$(fact CERT_SHA256); agent_sha=$(fact AGENT_SHA384)
          agent_version=$(node -p "require('./drive-agent/dist/manifest.json').version")
          mkdir -p release
          cp android/dist/repas-drive.apk release/repas-drive.apk
          (cd release && sha256sum repas-drive.apk > repas-drive.apk.sha256)
          [ "$(cut -d' ' -f1 release/repas-drive.apk.sha256)" = "$sha256" ] || { echo "::error::L'empreinte du fichier ne correspond pas au contrôle."; exit 1; }
          jq -n --arg versionName "$name" --argjson versionCode "$code" \
            --arg apkUrl "https://github.com/${REPO}/releases/download/${TAG}/repas-drive.apk" --arg sha256 "$sha256" \
            '{versionName: $versionName, versionCode: $versionCode, apkUrl: $apkUrl, sha256: $sha256, minAndroid: 26}' > release/version.json
          cat > release/notes.md <<NOTES
          Application Android « Repas » ${name} (numéro de version ${code}), signée de la clé de publication.

          **Installer** : sur le téléphone, télécharger \`repas-drive.apk\` (rubrique « Assets » plus bas), l'ouvrir et autoriser l'installation depuis Chrome ; **mettre à jour** : même geste, par-dessus. Pas à pas : https://github.com/${REPO}/blob/${GITHUB_SHA}/android/PUBLICATION.md

          - Empreinte SHA-256 de \`repas-drive.apk\` : \`${sha256}\` (\`sha256sum -c repas-drive.apk.sha256\` la vérifie)
          - Agent du drive embarqué : version ${agent_version}, empreinte SHA-384 \`${agent_sha}\`
          - Certificat de signature, empreinte SHA-256 : \`${cert}\` (celle de \`/.well-known/assetlinks.json\`)
          - Construit depuis le commit \`${GITHUB_SHA}\`

          Les pré-versions \`android-dev-…\` et \`android-lab-…\` sont signées d'une clé de débogage publique : ne jamais les installer à la place de cette version.
          NOTES
          cat release/version.json
          echo "APK signé : ${name} (code ${code}), SHA-256 ${sha256}, certificat ${cert}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            release/repas-drive.apk
            release/repas-drive.apk.sha256
            release/version.json
            release/notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Le fichier téléchargé est bien celui que le travail précédent a construit et contrôlé.
          sha256sum -c repas-drive.apk.sha256
          # Une release « normale » : ni brouillon ni pré-version, et sans prendre l'étiquette « Latest » aux versions du site (vX.Y.Z).
          gh release create "$TAG" repas-drive.apk repas-drive.apk.sha256 version.json \
            --verify-tag \
            --title "Repas Android ${TAG#android-v}" \
            --notes-file notes.md \
            --latest=false
          # On relit ce qui est publié : ce n'est ni un brouillon ni une pré-version, et l'APK téléchargé a l'empreinte annoncée.
          [ "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = "false" ] \
            || { echo "::error::La release $TAG est un brouillon ou une pré-version."; exit 1; }
          mkdir published
          gh release download "$TAG" --dir published --pattern repas-drive.apk --pattern repas-drive.apk.sha256
          (cd published && sha256sum -c repas-drive.apk.sha256)
          cmp repas-drive.apk published/repas-drive.apk
          echo "Release : https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
