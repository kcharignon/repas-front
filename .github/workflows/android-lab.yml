name: Android lab

# Application Android jetable du chantier drive (DRV-011, drive-agent/android-lab) : outil de test, supprimé après la décision G1.
# Séparé de ci.yml : `make check` ne construit pas l'application.
#   - « apk » joue les tests Kotlin et construit l'APK de débogage dans Docker, avec la même image et les mêmes commandes que
#     `make android-lab`, puis le dépose en artefact (sur une PR aussi) ;
#   - « prerelease » (main seulement) le publie dans une pré-version GitHub `android-lab-<date>`, avec son empreinte SHA-256.
# Une pré-version n'est jamais une release de production : release.yml ne s'occupe que des tags vX.Y.Z.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - drive-agent/android-lab/**
      - drive-agent/lab/published/lab.js
      - .github/workflows/android-lab.yml
      - compose.yaml
      - Makefile
  pull_request:
    paths:
      - drive-agent/android-lab/**
      - drive-agent/lab/published/lab.js
      - .github/workflows/android-lab.yml
      - compose.yaml
      - Makefile

permissions:
  contents: read

concurrency:
  group: android-lab-${{ github.ref }}
  # Une publication commencée n'est jamais interrompue ; seules les PR remplacent leur exécution précédente.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: APK de débogage (Docker)
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Tests Kotlin et construction de l'APK
        env:
          # Le numéro monte à chaque exécution : un APK plus récent s'installe par-dessus le précédent.
          ANDROID_LAB_VERSION_CODE: ${{ github.run_number }}
          ANDROID_LAB_COMMIT: ${{ github.sha }}
        run: make android-lab
      - name: Empreinte SHA-256
        id: apk
        run: |
          set -euo pipefail
          sha256=$(sha256sum drive-agent/android-lab/dist/repas-android-lab.apk | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "APK : $(stat -c %s drive-agent/android-lab/dist/repas-android-lab.apk) octets, SHA-256 $sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: repas-android-lab
          path: drive-agent/android-lab/dist/repas-android-lab.apk
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Pré-version GitHub
    needs: apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repas-android-lab
      - name: Publier la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ needs.apk.outputs.sha256 }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Le fichier téléchargé est bien celui que le job précédent a construit.
          echo "${SHA256}  repas-android-lab.apk" | sha256sum -c -
          date=$(date -u +%Y-%m-%d)
          tag="android-lab-${date}"
          n=1
          while gh release view "$tag" > /dev/null 2>&1; do
            n=$((n + 1))
            tag="android-lab-${date}-${n}"
          done
          cat > notes.md <<NOTES
          **Ne pas installer cette pré-version sur le téléphone des courses.** Elle est signée d'une clé de débogage PUBLIQUE (n'importe qui peut fabriquer un fichier qui s'installe par-dessus) et c'est un banc d'essai jetable, pas l'application Repas. Le téléphone des courses reçoit seulement une version \`android-vX.Y.Z\` (sans mention « Pre-release »). Mode d'emploi : https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/android/PUBLICATION.md

          APK de test jetable du chantier drive (DRV-011). Outil à supprimer après la décision G1.

          - Empreinte SHA-256 de \`repas-android-lab.apk\` : \`${SHA256}\`
          - Construit depuis le commit \`${GITHUB_SHA}\` (numéro de version de l'application : ${RUN_NUMBER})
          - Mode d'emploi pas à pas : https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/drive-agent/android-lab/PROCEDURE.md

          L'APK est signé avec la clé de débogage publique du dépôt (mot de passe \`android\`) : elle ne protège rien, désinstaller l'application à la fin du test.
          NOTES
          gh release create "$tag" repas-android-lab.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Banc Android ${date}" \
            --notes-file notes.md
          echo "Pré-version : https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
