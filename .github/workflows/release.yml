name: Release

# Publier une release GitHub (tag vX.Y.Z) construit l'image du front, la publie sur GHCR et la déploie en production.
# L'infrastructure (compose, bordure Caddy, deploy.sh) vit dans le dépôt back : kcharignon/repas, ADR 0017.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Contrôles
    # Les releases de l'application Android (`android-dev-<date>` : pré-version de débogage ; `android-vX.Y.Z` : publication
    # signée, android-release.yml) ne sont pas des versions du front : rien à déployer. Elles sont créées par des workflows avec le jeton
    # de GitHub, qui ne déclenche pas celui-ci ; cette condition garde la porte fermée si l'une d'elles était publiée à la main.
    if: ${{ !startsWith(github.event.release.tag_name, 'android-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Version et branche
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Le tag « $TAG » n'est pas une version vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Le tag est sur main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le commit de la release n'est pas dans main : on ne déploie que ce qui a été relu et fusionné"
            exit 1
          fi

  tests:
    name: Tests
    needs: checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image Docker (GHCR)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: prod
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement en production
    needs: publish
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois, partagé avec le back ; un déploiement commencé n'est jamais interrompu.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Déployer
        env:
          TAG: ${{ github.event.release.tag_name }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          # TAG est vérifié par le job Contrôles (vX.Y.Z) : son expansion côté client est voulue
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "cd /opt/repas && ./deploy.sh front $TAG"
          rm -f ~/.ssh/deploy_key
