name: Android

# Application Android « Repas Drive » (DRV-311, android/). Séparé de ci.yml : `make check` ne construit pas l'application.
#   - « debug » joue les tests Kotlin puis construit l'APK de débogage, avec les mêmes commandes que `make android-test` et `make android` ;
#   - « release » prouve que la publication refuse de se construire sans clé de signature et réussit avec une clé jetable créée dans le
#     job (`make android-release-selftest`). Aucune vraie clé n'est utilisée ici : la publication signée est celle de DRV-315.
# L'image de construction (JDK, Gradle, SDK Android) est lourde : ses couches sont gardées dans le cache de GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml
      - compose.yaml
      - Makefile
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml
      - compose.yaml
      - Makefile

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Tests Kotlin et APK de débogage (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      # Le nom de l'image est celui que compose lui donne (projet « repas-front », service « android ») : `make` la trouve déjà construite.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./android
          load: true
          tags: repas-front-android:latest
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
      - name: Tests Kotlin
        run: make android-test
      - name: APK de débogage
        env:
          # Le numéro monte à chaque exécution ; sans étiquette, la version est « 0.0.0-dev ».
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_COMMIT: ${{ github.sha }}
        run: make android
      - name: Taille et empreinte
        run: |
          set -euo pipefail
          apk=android/dist/repas-drive-debug.apk
          echo "APK de débogage : $(stat -c %s "$apk") octets, SHA-256 $(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: repas-drive-debug
          path: android/dist/repas-drive-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publication refusée sans clé, réussie avec une clé jetable (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./android
          load: true
          tags: repas-front-android:latest
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max
      - name: Essai de la publication
        run: make android-release-selftest
