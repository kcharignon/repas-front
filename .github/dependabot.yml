version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      vue:
        patterns: ["vue", "vue-router", "pinia", "@vue/*", "@vitejs/*", "vue-tsc", "vite", "vite-*"]
      tests:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "playwright*", "jsdom", "msw", "@testing-library/*"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "oxlint", "prettier", "typescript", "@typescript-eslint/*", "@vue/eslint-*"]
    ignore:
      # Les montées majeures se font à la main, une PR par chantier (même règle que le dépôt back, ADR 0014).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
