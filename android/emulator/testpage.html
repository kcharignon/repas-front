<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Pas de balise viewport : ce faux drive est une page de bureau (fenêtre de 980 px CSS), comme le site PC de l'enseigne. -->
<title>Page locale de test</title>
<style>
  body { font: 18px/1.4 system-ui, sans-serif; margin: 24px; color: #1d2b1f; background: #fff; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  a#store, a#fake-leclerc { display: inline-block; margin-bottom: 8px; padding: 12px 0; font-weight: 600; }
  p.note { margin: 0 0 20px; color: #4a5a4c; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; background: #f1f1ec; }
  li.ok { border-left: 8px solid #2e7d32; }
  li.ko { border-left: 8px solid #c62828; }
  li.wait { border-left: 8px solid #9e9e9e; }
</style>
</head>
<body>
<h1>Page locale de test</h1>
<p class="note">Faux site de l'émulateur (DRV-319, DRV-320) : aucune donnée d'enseigne. L'application doit y avoir mis son pont et son agent.</p>
<p><a id="store" href="/magasin-123456-123456-Ville-Test/accueil.aspx">Choisir mon magasin de test</a></p>
<p><a id="fake-leclerc" href="https://courses-test.leclercdrive.fr/magasin-000001-000001-Ville-Test/">Choisir le magasin du faux Leclerc</a></p>
<ul id="checks"></ul>
<script>
(function () {
  'use strict'
  var list = document.getElementById('checks')
  var rows = {}

  function show(key, label, ok, detail) {
    var row = rows[key]
    if (!row) {
      row = rows[key] = document.createElement('li')
      list.appendChild(row)
    }
    row.className = ok === null ? 'wait' : ok ? 'ok' : 'ko'
    row.textContent = label + ' : ' + (ok === null ? 'en attente' : ok ? 'oui' : 'non') + (detail ? ' (' + detail + ')' : '')
  }

  function report(item) {
    try {
      fetch('/__report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) })
    } catch (e) {
      /* le test de fumée verra l'absence de relevé */
    }
  }

  // Le pont n'est plus à la page une fois l'agent démarré : `repasHost` y est vide et ne peut plus être redéfini. Ce que l'agent a reçu de
  // l'application se lit donc à ce qu'il fait dans la page (son interface), jamais à un message que la page aurait vu passer.
  var hostProperty = Object.getOwnPropertyDescriptor(window, 'repasHost')
  var facts = {
    kind: 'load',
    hostname: location.hostname,
    path: location.pathname,
    topFrame: window.top === window,
    hostHidden: window.repasHost === undefined,
    hostLocked: !!hostProperty && hostProperty.configurable === false && hostProperty.value === undefined,
    desktopAgent: !/Mobile/i.test(navigator.userAgent),
  }
  show('hidden', 'Le pont repasHost est retiré de la page', facts.hostHidden)
  show('locked', 'La propriété repasHost ne peut plus être redéfinie', facts.hostLocked)
  show('desktop', 'Mode ordinateur (agent utilisateur sans « Mobile »)', facts.desktopAgent)
  show('agent', 'L’agent a affiché son interface', null)
  report(facts)

  // L'agent monte son interface (un élément ajouté à la page, au contenu fermé) au premier message de l'application qui en demande une.
  var baseline = document.documentElement.children.length
  var watcher = new MutationObserver(function () {
    if (document.documentElement.children.length <= baseline) return
    watcher.disconnect()
    show('agent', 'L’agent a affiché son interface', true)
    report({ kind: 'agent-ui', mounted: true })
  })
  watcher.observe(document.documentElement, { childList: true })
})()
</script>
</body>
</html>
